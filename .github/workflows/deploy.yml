name: Deploy to WordPress.org

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Checkout WordPress.org SVN
        run: |
          svn checkout https://plugins.svn.wordpress.org/master-pdf-viewer/ wp-svn

      - name: Copy plugin files to trunk
        run: |
          cp -r dist/* wp-svn/trunk/
          cp -r .wordpress-org/* wp-svn/assets/

      - name: Commit to SVN
        run: |
          cd wp-svn
          svn add --force trunk/* assets/*
          svn commit -m "Release ${{ github.event.release.tag_name }}" --username ${{ secrets.SVN_USERNAME }} --password ${{ secrets.SVN_PASSWORD }} --non-interactive
